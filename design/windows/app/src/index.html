<!-- 在线客服挂件（chat.niurend.xyz）：悬浮在首页右下角，1 秒后自动弹出。
     CSP 已为该域名放行。挂件自带浮窗 UI，因此原来的「客服」悬浮按钮/卡片已移除。 -->
<script src="https://chat.niurend.xyz/widget.js" host="https://chat.niurend.xyz" host-id="1" auto-reg="true" title="牛人24小时在线咨询" logo="https://chat.niurend.xyz/uploads/file_qp5s5lxpmv20ha6o.ico" theme-color="#2563eb" close-width="48" close-height="48" open-width="380" open-height="680" position="right" welcome="需要什么" popup-title="需要帮助吗？" popup-subtitle="客服随时在线！" popup-image="https://www.xiaoahua.cn/niuren/客服JS代码.jpeg" auto-open="false" auto-open-delay="0" async></script>
<script>
/* 客服挂件不自动展开：后台 /api/config 的 widgetParams.autoOpen 会覆盖页面属性，
 * 这里在挂件初始化后把 cfg.autoOpen / autoOpenDelay 锁死为 false/0——
 * 后台配置再怎么改也无法自动弹开聊天窗（手动点图标不受影响）。 */
(function () {
  var tries = 0;
  var t = setInterval(function () {
    if (++tries > 300) { clearInterval(t); return; }   // 最多等 15s
    if (!(window.CSW && CSW.config)) return;
    clearInterval(t);
    try {
      Object.defineProperty(CSW.config, "autoOpen", { get: function () { return false; }, set: function () {}, configurable: true });
      Object.defineProperty(CSW.config, "autoOpenDelay", { get: function () { return 0; }, set: function () {}, configurable: true });
      Object.defineProperty(CSW.config, "autoOpenOnce", { get: function () { return false; }, set: function () {}, configurable: true });
    } catch (e) {}
  }, 50);
})();
</script>
